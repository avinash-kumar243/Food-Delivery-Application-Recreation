server:
  port: 8083

spring:
  application:
    name: menu-service

  # H2 Database
  datasource:
    url: jdbc:h2:mem:quickbite_menu_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true 

# JWT Credentials
jwt:
  secret: ${JWT_SECRET}

# Eureka Discovery
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: true

# Actuator Endpoint Expose
management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

